<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="guitarGrad" x1="12" y1="60" x2="52" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="neckGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="guitarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8b5cf6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="64" height="64" rx="16" fill="#0f111a"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#guitarGrad)" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Guitar (Tilted 35 degrees) -->
  <g transform="translate(32, 32) rotate(-35) translate(-32, -32)">
    <!-- Guitar Body -->
    <path d="M22 35 C15 37 14 48 21 54 C27 58 37 58 43 54 C50 48 49 37 42 35 C38 33 38 29 40 25 C42 20 38 17 32 17 C26 17 22 20 24 25 C26 29 26 33 22 35 Z" fill="url(#guitarGrad)" filter="url(#guitarGlow)"/>
    
    <!-- Sound Hole -->
    <circle cx="32" cy="32" r="5.5" fill="#090a0f" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="3" fill="#1e1b4b"/>
    
    <!-- Bridge -->
    <rect x="26" y="46" width="12" height="3" rx="1.5" fill="#18181b" stroke="#f59e0b" stroke-width="0.75"/>
    
    <!-- Neck -->
    <rect x="30" y="2" width="4" height="17" fill="url(#neckGrad)"/>
    
    <!-- Frets -->
    <line x1="30" y1="5" x2="34" y2="5" stroke="#475569" stroke-width="0.75"/>
    <line x1="30" y1="9" x2="34" y2="9" stroke="#475569" stroke-width="0.75"/>
    <line x1="30" y1="13" x2="34" y2="13" stroke="#475569" stroke-width="0.75"/>
    
    <!-- Headstock -->
    <path d="M29 -2 L35 -2 L34 3 L30 3 Z" fill="#8b5cf6"/>
    <!-- Tuning Pegs -->
    <circle cx="28" cy="0" r="1.2" fill="#fbbf24"/>
    <circle cx="36" cy="0" r="1.2" fill="#fbbf24"/>
    <circle cx="28" cy="2" r="1.2" fill="#fbbf24"/>
    <circle cx="36" cy="2" r="1.2" fill="#fbbf24"/>
    
    <!-- Strings -->
    <line x1="31" y1="0" x2="31" y2="46" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.9"/>
    <line x1="32" y1="0" x2="32" y2="46" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.95"/>
    <line x1="33" y1="0" x2="33" y2="46" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.9"/>
  </g>
</svg>